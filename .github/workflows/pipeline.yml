name: Pipeline LiDAR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "requirements.txt"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache des données brutes (LiDAR + inventaire)
        uses: actions/cache@v4
        with:
          path: cache
          key: donnees-${{ hashFiles('pipeline/config.py') }}
      - name: Traitement LiDAR et apprentissage
        shell: bash
        run: python pipeline/run.py 2>&1 | tee pipeline.log
      - name: Résumé
        if: always()
        shell: bash
        run: |
          { echo '```'; tail -n 80 pipeline.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          # le journal est aussi publié en annotation, lisible depuis l'API GitHub
          python -c "import sys;t=open('pipeline.log',encoding='utf-8').read()[-3500:];print('::notice title=Journal du pipeline::'+t.replace('%','%25').replace('\\r','').replace('\\n','%0A'))"
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-web
          path: public/data
