name: Pipeline LiDAR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "requirements.txt"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache des données brutes (LiDAR + inventaire)
        uses: actions/cache@v4
        with:
          path: cache
          key: donnees-${{ hashFiles('pipeline/config.py') }}
      - name: Traitement LiDAR et apprentissage
        run: python pipeline/run.py | tee pipeline.log
      - name: Résumé
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 pipeline.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-web
          path: public/data
