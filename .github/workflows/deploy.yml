name: Pipeline LiDAR et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache des données brutes (LiDAR + inventaire)
        uses: actions/cache@v4
        with:
          path: cache
          key: donnees-${{ hashFiles('pipeline/config.py', 'pipeline/telechargement.py') }}
      - name: Traitement LiDAR et apprentissage
        shell: bash
        run: python pipeline/run.py 2>&1 | tee pipeline.log
      - name: Journal
        if: always()
        shell: bash
        run: |
          { echo '```'; tail -n 80 pipeline.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          # le journal est aussi publié en annotation, lisible depuis l'API GitHub
          python -c "t=open('pipeline.log',encoding='utf-8').read()[-3500:];print('::notice title=Journal du pipeline::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
      - uses: actions/upload-artifact@v4
        with:
          name: donnees-web
          path: public/data

  build:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: donnees-web
          path: public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
